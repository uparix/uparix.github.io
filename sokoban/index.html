<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sokoban by Cronos</title>
    <style>
      body {
        background: #edf5ff;
        color: #000080;
        font-family: system-ui, sans-serif;
        text-align: center;
        margin: 1.5rem;
      }
      canvas {
        background: #edf5ff;
        image-rendering: pixelated;
      }
      .controls {
        margin-top: 0.75rem;
      }
      #status {
        min-height: 1.2em;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Sokoban</h1>
    <p>Hit Start Problem to Start the problem or to restart the problem when stuck.</p>
    <canvas id="board"></canvas>
    <div class="controls">
      <label>Level: <select id="level"></select></label>
      <button id="restart" type="button">Restart Level</button>
      <button id="replay" type="button">Replay Moves</button>
    </div>
    <div id="status">&nbsp;</div>
    <script src="sokoban.js"></script>
  </body>
</html>
