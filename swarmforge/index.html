<html lang="en">
	<head>
		<title>SwarmForge</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="styles.css"/>
		<script src="clipboard.js" defer></script>
	</head>
	<body>
		<div class="container">
			<h1>SwarmForge</h1>
			<p class="tagline">Open a <code>herdr</code> workspace with one pane per <code>claude</code> agent.</p>

			<h2>Prerequisite</h2>
			<pre><code>brew install herdr</code></pre>

			<h2>Install</h2>
			<pre class="code-block"><button class="copy-btn" onclick="copyInstallCommand(this)">Copy</button><code id="install-command">curl -fsSL https://www.uparix.com/swarmforge/install.sh | sh</code></pre>

			<h2>Usage</h2>
			<pre><code>python swarmforge.py</code></pre>
		</div>
	</body>
</html>
